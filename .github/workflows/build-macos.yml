name: Build and upload unsigned macOS candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing Release tag to receive the verified unsigned assets
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      MACOS_SIGNING_MODE: unsigned
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify optional Release target
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          gh release view "$RELEASE_TAG" >/dev/null

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          changed_app_paths="$(git diff --name-only "$tag_commit"...HEAD -- package.json package-lock.json src-tauri ui)"
          if [ -n "$changed_app_paths" ]; then
            printf 'Release source differs from %s in app-affecting paths:\n%s\n' "$RELEASE_TAG" "$changed_app_paths" >&2
            exit 1
          fi

      - name: Verify source and tests
        run: |
          npm run check:versions
          npm run typecheck
          npm run lint
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Generate license artifact
        shell: pwsh
        run: ./scripts/generate-third-party-licenses.ps1 -CargoTarget aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build unsigned Universal app and DMG
        run: npm run tauri:build:macos -- --no-sign --ci

      - name: Verify and stage macOS artifacts
        run: bash ./scripts/verify-macos-bundle.sh

      - name: Upload failed bundle diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chronolume-macos-unverified-debug-${{ github.run_id }}
          path: src-tauri/target/universal-apple-darwin/release/bundle
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chronolume-unsigned-macos-universal
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14

      - name: Append verified unsigned assets to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/macos/* --clobber
