name: Build unsigned macOS candidate

on:
  workflow_dispatch:
  # The workflow is new on this implementation branch, so GitHub cannot dispatch it
  # manually until it also exists on the default branch. This branch-scoped trigger
  # produces the required first Universal candidate without broadening release gates.
  push:
    branches:
      - codex/macos-support

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify source and tests
        run: |
          npm run check:versions
          npm run typecheck
          npm run lint
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Generate license artifact
        shell: pwsh
        run: ./scripts/generate-third-party-licenses.ps1 -CargoTarget aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build unsigned Universal app and DMG
        run: npm run tauri:build:macos -- --no-sign --ci

      - name: Verify and stage macOS artifacts
        run: bash ./scripts/verify-macos-bundle.sh

      - name: Upload failed bundle diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chronolume-2.1.0-macos-unverified-debug
          path: src-tauri/target/universal-apple-darwin/release/bundle
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chronolume-unsigned-macos-universal
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 14
